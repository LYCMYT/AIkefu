# Single-host production-style deployment for the synthetic, Mock-only demo.
# Only the Nginx web service publishes a host port; stateful dependencies stay
# on the isolated backend network.
services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ai_customer_service}
      POSTGRES_USER: ${POSTGRES_USER:-ai_customer_service}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment file}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/001-extensions.sql:/docker-entrypoint-initdb.d/001-extensions.sql:ro
    networks:
      - backend

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Compose preserves $$ for the container, then sh expands the runtime-only
    # password. The exec-form Redis command would otherwise receive the
    # literal string "$REDIS_PASSWORD".
    command: ["sh", "-c", "exec redis-server --appendonly yes --save 60 1000 --requirepass \"$$REDIS_PASSWORD\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in the production environment file}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    volumes:
      - redis_data:/data
    networks:
      - backend

  minio:
    image: minio/minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the production environment file}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the production environment file}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    volumes:
      - minio_data:/data
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    environment:
      NODE_ENV: production
      API_PORT: 3000
      WEB_ORIGIN: ${WEB_ORIGIN:?Set WEB_ORIGIN to the public HTTPS/HTTP origin}
      WS_PATH: /ws
      DATABASE_URL: postgresql://${POSTGRES_USER:-ai_customer_service}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in the production environment file}@postgres:5432/${POSTGRES_DB:-ai_customer_service}
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in the production environment file}@redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-ai-customer-service-demo}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in the production environment file}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in the production environment file}
      S3_FORCE_PATH_STYLE: "true"
      ATTACHMENT_STORAGE_TIMEOUT_MS: ${ATTACHMENT_STORAGE_TIMEOUT_MS:-8000}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-1mb}
      DEMO_WORKSPACE_IDLE_EXPIRY_HOURS: ${DEMO_WORKSPACE_IDLE_EXPIRY_HOURS:-24}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_FAST_MODEL: ${AI_FAST_MODEL:-}
      AI_QUALITY_MODEL: ${AI_QUALITY_MODEL:-}
      AI_MULTIMODAL_MODEL: ${AI_MULTIMODAL_MODEL:-}
      AI_JUDGE_MODEL: ${AI_JUDGE_MODEL:-}
      AI_EMBEDDING_MODEL: ${AI_EMBEDDING_MODEL:-}
      AI_EMBEDDING_DIM: ${AI_EMBEDDING_DIM:-1536}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-8000}
      AI_EXTERNAL_IMAGE_ANALYSIS_OPT_IN: ${AI_EXTERNAL_IMAGE_ANALYSIS_OPT_IN:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "const net=require('node:net');const socket=net.connect(3000,'127.0.0.1');socket.setTimeout(2000);socket.on('connect',()=>{socket.end();process.exit(0)});socket.on('error',()=>process.exit(1));socket.on('timeout',()=>process.exit(1));"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 60s
    deploy:
      replicas: 1
    networks:
      - backend

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks:
      - frontend
      - backend

networks:
  frontend:
  backend:
    internal: true

volumes:
  postgres_data:
  redis_data:
  minio_data:
