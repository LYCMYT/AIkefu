    KnowledgeSearchInput:
      type: object
      required: [shopId, query]
      properties:
        shopId: { type: string }
        query: { type: string }
        scope: { type: string, enum: [STORE, PRODUCT] }
        productId: { type: string }
        topK: { type: integer, minimum: 1, maximum: 3 }

    ReplyEvidenceSnapshot:
      type: object
      required: [itemId, versionId, version, source, scope, contentSnapshot, retrievalScore]
      properties:
        itemId: { type: string }
        versionId: { type: string }
        version: { type: integer }
        source: { type: string, enum: [MANUAL, HUMAN_REVIEWED, AUTO_LEARNED] }
        scope: { type: string, enum: [STORE, PRODUCT] }
        productId: { type: string, nullable: true }
        contentSnapshot:
          type: object
          required: [question, answer]
          properties:
            question: { type: string }
            answer: { type: string }
        retrievalScore: { type: number }

    KnowledgeSearchResult:
      type: object
      required: [status, evidence, conflictItemIds]
      properties:
        status: { type: string, enum: [EVIDENCE, NO_EVIDENCE, CONFLICTED, DYNAMIC_FACT_REQUIRED] }
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/ReplyEvidenceSnapshot"
        conflictItemIds:
          type: array
          items: { type: string }

    KnowledgeRevisionResult:
      type: object
      required: [status, knowledgeId, version]
      properties:
        status: { type: string, enum: [UPDATED, CONFLICTED] }
        knowledgeId: { type: string }
        activeVersionId: { type: string, nullable: true }
        version:
          $ref: "#/components/schemas/KnowledgeVersion"

    KnowledgeConflictSide:
      type: object
      required: [itemId, versionId, question, answer]
      properties:
        itemId: { type: string }
        versionId: { type: string }
        version: { type: integer }
        question: { type: string }
        answer: { type: string }
        indexStatus: { type: string, enum: [PENDING, INDEXING, READY, FAILED] }

    KnowledgeCandidateStatus:
      type: string
      enum: [PENDING, APPROVED, PUBLISHED, REJECTED, DUPLICATE, CONFLICTED]

    KnowledgeConflictStatus:
      type: string
      enum: [OPEN, RESOLVED, IGNORED]

    KnowledgeConflictResolution:
      type: string
      enum: [KEEP_LEFT, KEEP_RIGHT, MERGE, CUSTOM]

    KnowledgeCandidate:
      type: object
      required: [id, source, proposedQuestion, proposedAnswer, status]
      properties:
        id: { type: string }
        shopId: { type: string }
        source: { type: string }
        proposedQuestion: { type: string }
        proposedAnswer: { type: string }
        productId: { type: string, nullable: true }
        status:
          $ref: "#/components/schemas/KnowledgeCandidateStatus"
        duplicateOfId: { type: string, nullable: true }
        conflictWithId: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }

    KnowledgeConflict:
      type: object
      required: [id, leftVersionId, rightVersionId, status]
      properties:
        id: { type: string }
        shopId: { type: string }
        leftItemId: { type: string }
        rightItemId: { type: string }
        leftVersionId: { type: string }
        rightVersionId: { type: string }
        left:
          $ref: "#/components/schemas/KnowledgeConflictSide"
        right:
          $ref: "#/components/schemas/KnowledgeConflictSide"
        status:
          $ref: "#/components/schemas/KnowledgeConflictStatus"
        resolution: { type: object, nullable: true }
        resolvedAt: { type: string, format: date-time, nullable: true }
        updatedAt: { type: string, format: date-time }

    ReplyJobStatus:
      type: string
      enum: [PENDING, GENERATING, FAST_PATH_READY, WAITING_HUMAN, SENT, CANCELLING, STALE, EXPIRED, CANCELLED, FAILED, RECOVERY_PENDING]

    ReplyDraftStatus:
      type: string
      enum: [GENERATING, WAITING_HUMAN, STALE, EXPIRED, FAILED, SENT, CANCELLED]

    ReplyDraftEditType:
      type: string
      enum: [STYLE_EDIT, FACTUAL_CORRECTION, KNOWLEDGE_ENRICHMENT]

    ReplyDraft:
      type: object
      required: [id, replyJobId, aiDraft, status, sourceContextVersion]
      properties:
        id: { type: string }
        replyJobId: { type: string }
        aiDraft: { type: string }
        humanFinal: { type: string, nullable: true }
        editType:
          allOf:
            - $ref: "#/components/schemas/ReplyDraftEditType"
          nullable: true
        status:
          $ref: "#/components/schemas/ReplyDraftStatus"
        sourceContextVersion: { type: integer }
        sourceLastMessageId: { type: string, nullable: true }
        sourceSequence: { type: integer, nullable: true }
        generatedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        staleReason: { type: string, nullable: true }
        updatedAt: { type: string, format: date-time }

    ReplyJob:
      type: object
      required: [id, conversationId, status, mode]
      properties:
        id: { type: string }
        conversationId: { type: string }
        userTurnId: { type: string, nullable: true }
        status:
          $ref: "#/components/schemas/ReplyJobStatus"
        mode:
          $ref: "#/components/schemas/ConversationMode"
        sourceLastMessageId: { type: string, nullable: true }
        sourceSequence: { type: integer, nullable: true }
        sourceContextVersion: { type: integer, nullable: true }
        needsReplanReason: { type: string, nullable: true }
        abortReason: { type: string, nullable: true }
        provider: { type: string, nullable: true }
        model: { type: string, nullable: true }
        promptVersion: { type: string, nullable: true }
        ragStrategy: { type: string, nullable: true }
        tokenUsage:
          type: object
          properties:
            inputTokens: { type: integer }
            outputTokens: { type: integer }
        fallbackUsed: { type: boolean }
        draft:
          allOf:
            - $ref: "#/components/schemas/ReplyDraft"
          nullable: true
        currentDraft:
          allOf:
            - $ref: "#/components/schemas/ReplyDraft"
          nullable: true
        sendOutbox:
          allOf:
            - $ref: "#/components/schemas/SendOutbox"
          nullable: true
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    SendOutboxStatus:
      type: string
      enum: [PENDING, SENDING, SENT, FAILED, UNCERTAIN, CANCELLED]

    SendOutbox:
      type: object
      required: [id, idempotencyKey, status]
      properties:
        id: { type: string }
        conversationId: { type: string }
        replyJobId: { type: string, nullable: true }
        idempotencyKey: { type: string }
        expectedLastMessageId: { type: string, nullable: true }
        expectedSequence: { type: integer, nullable: true }
        expectedContextVersion: { type: integer, nullable: true }
        status:
          $ref: "#/components/schemas/SendOutboxStatus"
        receipt:
          type: object
          nullable: true
          properties:
            externalMessageId: { type: string }
            platformMessageId: { type: string }
            sentAt: { type: string, format: date-time }
        failureCode: { type: string, nullable: true }
        failureReason: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    Task:
      type: object
      required: [id, userTurnId, intent, riskLevel, requiredContext, status, blocking]
      properties:
        id: { type: string }
        userTurnId: { type: string }
        intent: { type: string }
        riskLevel: { type: string, enum: [LOW, MEDIUM, HIGH] }
        requiredContext:
          type: array
          items: { type: string }
        requiredKnowledge:
          type: array
          items: { type: string }
        requiredTools:
          type: array
          items: { type: string }
        ownerWorkflowRunId: { type: string, nullable: true }
        status: { type: string }
        result: { type: object, nullable: true }
        blocking: { type: boolean }

    TaskBundle:
      type: object
      required: [id, userTurnId, status, tasks]
      properties:
        id: { type: string }
        userTurnId: { type: string }
        status: { type: string, enum: [ALL_RESOLVED, PARTIAL_RESOLVED, NEEDS_CLARIFICATION, HIGH_RISK, FAILED] }
        tasks:
          type: array
          maxItems: 4
          items:
            $ref: "#/components/schemas/Task"

    CustomerMemoryDisableInput:
      type: object
      required: [shopId]
      properties:
        shopId: { type: string }
        reason: { type: string }

    ConversationControlResult:
      type: object
      required: [id]
      properties:
        id: { type: string }
        overrideMode:
          allOf:
            - $ref: "#/components/schemas/ConversationMode"
          nullable: true
        effectiveMode:
          $ref: "#/components/schemas/ConversationMode"
        shopAiMode:
          $ref: "#/components/schemas/ShopAIMode"
        humanActive: { type: boolean }
        resumed: { type: boolean }

    HumanFinalAccepted:
      type: object
      required: [sendOutboxId]
      properties:
        sendOutboxId: { type: string }
        candidateId: { type: string }
        status: { type: string, enum: [ACCEPTED, QUEUED] }

    ConversationSummary:
      type: object
      required: [id, shopId, buyer, state, effectiveMode, contextVersion]
      properties:
        id: { type: string }
        shopId: { type: string }
        buyer:
          $ref: "#/components/schemas/Buyer"
        state: { type: string }
        effectiveMode:
          $ref: "#/components/schemas/ConversationMode"
        contextVersion: { type: integer }
        humanActive: { type: boolean }
        needsReplan: { type: boolean }
        activeReplyJob:
          $ref: "#/components/schemas/ReplyJob"
        sendOutbox:
          $ref: "#/components/schemas/SendOutbox"
        unreadCount: { type: integer }
        lastMessage:
          $ref: "#/components/schemas/Message"

    ConversationSnapshot:
      allOf:
        - $ref: "#/components/schemas/ConversationSummary"
        - type: object
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
            productContext:
              type: object
            customerContext:
              type: object
            summary:
              type: object
            currentDraft:
              $ref: "#/components/schemas/ReplyDraft"
            taskBundle:
              $ref: "#/components/schemas/TaskBundle"
            customerMemories:
              type: array
              items:
                $ref: "#/components/schemas/CustomerMemory"

    Message:
      type: object
      required: [id, conversationId, role, kind, status, sequence, sentAt]
      properties:
        id: { type: string }
        conversationId: { type: string }
        externalMessageId: { type: string }
        sequence: { type: integer }
        role: { type: string, enum: [BUYER, AI, HUMAN, SYSTEM] }
        kind: { type: string, enum: [TEXT, IMAGE, GOODS_CARD, ORDER_CARD, SYSTEM] }
        status: { type: string, enum: [ACTIVE, RECALLED, DELETED, EDITED] }
        content:
          type: object
        sentAt: { type: string, format: date-time }
        receivedAt: { type: string, format: date-time }

    Buyer:
      type: object
      required: [id, externalBuyerId, displayName]
      properties:
        id: { type: string }
        externalBuyerId: { type: string }
        displayName: { type: string }
        avatarUrl: { type: string }
        tags:
          type: array
          items: { type: string }

    CustomerMemoryInput:
      type: object
      required: [shopId, type, key, value]
      properties:
        shopId: { type: string }
        type:
          type: string
          enum: [PREFERENCE, PRODUCT_PREFERENCE, ONGOING_CASE]
        key: { type: string }
        value:
          type: object
        expiresAt:
          type: string
          format: date-time

    CustomerMemory:
      allOf:
        - $ref: "#/components/schemas/CustomerMemoryInput"
        - type: object
          required: [id, buyerId, status]
          properties:
            id: { type: string }
            buyerId: { type: string }
            status: { type: string, enum: [ACTIVE, DISABLED, DELETED] }

    CustomerMemoryStatusResult:
      type: object
      required: [id, status]
      properties:
        id: { type: string }
        status: { type: string, enum: [ACTIVE, DISABLED, DELETED] }

    CustomerDataDeletionResult:
      type: object
      required: [buyerId, status, deleted, anonymized, preserved, completedAt]
      properties:
        buyerId: { type: string, description: Opaque request reference only }
        status: { type: string, enum: [COMPLETED] }
        deleted:
          type: object
          required: [conversations, messages, attachments, customerMemories, knowledgeCandidates]
          properties:
            conversations: { type: integer, minimum: 0 }
            messages: { type: integer, minimum: 0 }
            attachments: { type: integer, minimum: 0 }
            customerMemories: { type: integer, minimum: 0 }
            knowledgeCandidates: { type: integer, minimum: 0 }
        anonymized:
          type: object
          required: [buyers, orders]
          properties:
            buyers: { type: integer, minimum: 0 }
            orders: { type: integer, minimum: 0 }
        preserved:
          type: object
          required: [anonymousAggregates, auditFacts]
          properties:
            anonymousAggregates: { type: integer, minimum: 0 }
            auditFacts: { type: integer, minimum: 0 }
        completedAt: { type: string, format: date-time }

    BuyerMessageInput:
      type: object
      required: [shopId, buyerId, kind]
      properties:
        shopId: { type: string }
        buyerId: { type: string }
        kind: { type: string, enum: [TEXT, IMAGE] }
        text: { type: string }
        attachmentId: { type: string }
        sentAt: { type: string, format: date-time }
        forcedSequence: { type: integer }
        duplicateExternalMessageId: { type: string }

    Attachment:
      type: object
      required: [id, mimeType, size, status, expiresAt]
      properties:
        id: { type: string }
        mimeType: { type: string }
        size: { type: integer }
        status: { type: string, enum: [ACTIVE, EXPIRED, DELETED] }
        containsPII: { type: boolean }
        expiresAt: { type: string, format: date-time }
        analysis:
          type: object

    Workflow:
      type: object
      required: [id, name, type, priority, status]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        tenantId: { type: string }
        shopId: { type: [string, 'null'] }
        name: { type: string }
        type: { type: string }
        priority: { type: integer, minimum: 0 }
        status: { type: string, enum: [DRAFT, PUBLISHED, DISABLED] }
        activeVersionId: { type: [string, 'null'] }
        draftVersion:
          oneOf:
            - $ref: "#/components/schemas/WorkflowVersion"
            - type: 'null'
        activeVersion:
          oneOf:
            - $ref: "#/components/schemas/WorkflowVersion"
            - type: 'null'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreateWorkflowInput:
      type: object
      required: [name, type]
      properties:
        name: { type: string, minLength: 1 }
        type: { type: string, minLength: 1 }
        shopId: { type: string }
        priority: { type: integer, minimum: 0 }

    WorkflowVersion:
      type: object
      required: [id, workflowId, version, graph]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        tenantId: { type: string }
        workflowId: { type: string }
        version: { type: integer, minimum: 0 }
        graph:
          $ref: "#/components/schemas/WorkflowGraph"
        publishedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }

    WorkflowSettings:
      type: object
      required: [maxSteps, timeoutMs]
      properties:
        maxSteps: { type: integer, minimum: 1, maximum: 20 }
        timeoutMs: { type: integer, minimum: 1, maximum: 30000 }

    WorkflowGraph:
      type: object
      required: [nodes, edges, settings]
      properties:
        nodes:
          type: array
          items:
            type: object
            required: [id, type, position, config]
            properties:
              id: { type: string, minLength: 1 }
              type:
                type: string
                enum:
                  [TRIGGER, CONDITION, QUERY_PRODUCT, QUERY_ORDER, QUERY_LOGISTICS, AI_GENERATE, HUMAN_APPROVAL, END]
              position:
                type: object
                required: [x, y]
                properties:
                  x: { type: number }
                  y: { type: number }
              config:
                type: object
                additionalProperties: true
        edges:
          type: array
          items:
            type: object
            required: [id, source, target]
            properties:
              id: { type: string, minLength: 1 }
              source: { type: string, minLength: 1 }
              target: { type: string, minLength: 1 }
              condition: { type: string, enum: ["true", "false"] }
        settings:
          $ref: "#/components/schemas/WorkflowSettings"

    NodeRun:
      type: object
      required: [id, workflowRunId, nodeId, status, retryCount]
      properties:
        id: { type: string }
        workflowRunId: { type: string }
        nodeId: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, WAITING_APPROVAL, STALE, SKIPPED] }
        input: { type: [object, 'null'] }
        output: { type: [object, 'null'] }
        errorCode: { type: [string, 'null'] }
        retryCount: { type: integer, minimum: 0 }
        startedAt: { type: [string, 'null'], format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        durationMs: { type: [integer, 'null'], minimum: 0 }

    WorkflowRun:
      type: object
      required: [id, shopId, conversationId, workflowVersionId, taskIds, contextVersion, completedNodeIds, status, startedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        tenantId: { type: string }
        shopId: { type: string }
        conversationId: { type: string }
        workflowVersionId: { type: string }
        taskIds:
          type: array
          items: { type: string }
        contextVersion: { type: integer, minimum: 0 }
        currentNodeId: { type: [string, 'null'] }
        completedNodeIds:
          type: array
          items: { type: string }
        status:
          type: string
          enum: [PENDING, RUNNING, WAITING_APPROVAL, RECOVERING, COMPLETED, FAILED, STALE, CANCELLED]
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
        nodeRuns:
          type: array
          items:
            $ref: "#/components/schemas/NodeRun"
        proposals:
          type: array
          items:
            $ref: "#/components/schemas/ActionProposal"

    WorkflowTestRunInput:
      type: object
      required: [conversationId]
      properties:
        conversationId: { type: string }

    ActionProposal:
      type: object
      required: [id, shopId, conversationId, type, riskLevel, targetEntityType, targetEntityId, contextVersion, status]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        tenantId: { type: string }
        shopId: { type: string }
        conversationId: { type: string }
        workflowRunId: { type: [string, 'null'] }
        type: { type: string, enum: [MARK_READ, CREATE_INTERNAL_TASK, TRANSFER_HUMAN, ADD_ORDER_REMARK, PROPOSE_COMPENSATION, REFUND, EXCHANGE] }
        riskLevel: { type: string, enum: [READ, LOW_WRITE, MEDIUM_WRITE, HIGH_RISK] }
        targetEntityType: { type: string }
        targetEntityId: { type: string }
        payload: { type: object, additionalProperties: true }
        evidenceIds:
          type: array
          items: { type: string }
        contextVersion: { type: integer, minimum: 0 }
        status: { type: string, enum: [PROPOSED, POLICY_CHECKED, WAITING_APPROVAL, APPROVED, REVALIDATING, EXECUTING, SUCCEEDED, REJECTED, STALE, FAILED, UNCERTAIN, CANCELLED] }
        approvedBy: { type: [string, 'null'] }
        approvedAt: { type: [string, 'null'], format: date-time }
        receipt: { type: [object, 'null'], additionalProperties: true }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ApproveActionProposalInput:
      type: object
      properties:
        expectedContextVersion: { type: integer, minimum: 0 }
        idempotencyKey: { type: string, minLength: 1 }

    RejectActionProposalInput:
      type: object
      properties:
        reason: { type: string }

    QualityDeterministicCheck:
      type: object
      required: [key, passed]
      properties:
        key: { type: string }
        passed: { type: boolean }
        reason: { type: string }

    QualityDeterministicResult:
      type: object
      required: [passed, checks]
      properties:
        passed: { type: boolean }
        checks:
          type: array
          items:
            $ref: "#/components/schemas/QualityDeterministicCheck"

    QualityJudgeResult:
      type: object
      required: [relevance, completeness, groundedness, tone, risk, result]
      properties:
        relevance: { type: number, minimum: 0, maximum: 1 }
        completeness: { type: number, minimum: 0, maximum: 1 }
        groundedness: { type: number, minimum: 0, maximum: 1 }
        tone: { type: number, minimum: 0, maximum: 1 }
        risk: { type: string, enum: [LOW, MEDIUM, HIGH] }
        result: { type: string, enum: [PASS, FAIL, NEEDS_HUMAN] }
        reasons:
          type: array
          items: { type: string }

    QualityReview:
      type: object
      required: [id, conversationId, status]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        tenantId: { type: string }
        conversationId: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, AUTO_REVIEWED, PASS, FAIL, NEEDS_HUMAN] }
        deterministicResult:
          oneOf:
            - $ref: "#/components/schemas/QualityDeterministicResult"
            - type: 'null'
        judgeResult:
          oneOf:
            - $ref: "#/components/schemas/QualityJudgeResult"
            - type: 'null'
        humanResult: { type: [string, 'null'], enum: [PASS, FAIL, NEEDS_HUMAN, null] }
        sampleSize: { type: integer, minimum: 0 }
        metrics:
          type: object
          additionalProperties: { type: number }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        completedAt: { type: [string, 'null'], format: date-time }

    StartQualityReviewInput:
      type: object
      required: [conversationId]
      properties:
        conversationId: { type: string }

    QualityConclusionInput:
      type: object
      required: [result]
      additionalProperties: false
      properties:
        result: { type: string, enum: [PASS, FAIL, NEEDS_HUMAN] }

    ReplyIncident:
      type: object
      required: [id, replyId, errorType, severity, originalAnswer, status]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        tenantId: { type: string }
        conversationId: { type: string }
        replyId: { type: string }
        replyJobId: { type: string }
        errorType: { type: string }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH] }
        sourceType: { type: [string, 'null'] }
        originalAnswer: { type: string }
        correctedAnswer: { type: [string, 'null'] }
        rootCause: { type: [string, 'null'] }
        status: { type: string, enum: [OPEN, CORRECTION_DRAFTED, CORRECTED, ROOT_CAUSE_FIXED, REGRESSION_ADDED, RESOLVED] }
        regressionCaseId: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
        resolvedAt: { type: [string, 'null'], format: date-time }

    CreateReplyIncidentInput:
      type: object
      required: [errorType, severity]
      properties:
        errorType: { type: string }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH] }
        notes: { type: string }

    CorrectionInput:
      type: object
      required: [correctedAnswer]
      properties:
        correctedAnswer: { type: string }
        sendToBuyer: { type: boolean, default: false }

    RootCauseInput:
      type: object
      required: [rootCause]
      additionalProperties: false
      properties:
        rootCause: { type: string, minLength: 1, maxLength: 1000 }

    AddIncidentRegressionInput:
      type: object
      properties:
        caseId: { type: string }

    TraceEvent:
      type: object
      required: [id, traceId, stage, payload, createdAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        tenantId: { type: string }
        shopId: { type: [string, 'null'] }
        conversationId: { type: [string, 'null'] }
        replyJobId: { type: [string, 'null'] }
        traceId: { type: string }
        stage: { type: string }
        payload: { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    DeveloperTrace:
      type: object
      required: [traceId, events]
      properties:
        traceId: { type: string }
        workspaceId: { type: string }
        conversationId: { type: string }
        replyId: { type: string }
        events:
          type: array
          items:
            $ref: "#/components/schemas/TraceEvent"
        rawMessages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        userTurn: { type: object, additionalProperties: true }
        taskBundle: { type: object, additionalProperties: true }
        contextResolver: { type: object, additionalProperties: true }
        factContext: { type: object, additionalProperties: true }
        evidence:
          type: array
          items: { type: object, additionalProperties: true }
        replyPolicy: { type: object, additionalProperties: true }
        workflow: { type: object, additionalProperties: true }
        sendGuard: { type: object, additionalProperties: true }
        aiRuntime: { type: object, additionalProperties: true }
        quality: { type: object, additionalProperties: true }

    UsageSummary:
      type: object
      required: [calls, inputTokens, outputTokens, estimatedCost, failures, fallbacks, fastPathReplies, byPurpose]
      properties:
        calls: { type: integer }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        estimatedCost: { type: number }
        failures: { type: integer }
        fallbacks: { type: integer }
        fastPathReplies: { type: integer }
        byPurpose:
          type: object
          additionalProperties:
            type: object
            required: [calls, inputTokens, outputTokens, failures, fallbacks]
            properties:
              calls: { type: integer }
              inputTokens: { type: integer }
              outputTokens: { type: integer }
              failures: { type: integer }
              fallbacks: { type: integer }

    Scenario:
      type: object
      required: [key, name, status, synthetic]
      properties:
        key:
          type: string
          enum: [continuous_messages, message_during_generation, two_buyers, two_shops, duplicate_and_reorder, ai_timeout_fallback, service_restart_recovery, realtime_state_change]
        name: { type: string }
        status: { type: string, enum: [READY, RUNNING, SUCCEEDED, FAILED, RESETTING] }
        synthetic: { type: boolean, const: true }
        description: { type: string }
        expectedResult: { type: string }
        steps:
          type: array
          items:
            $ref: "#/components/schemas/ScenarioStep"
        traceId: { type: [string, 'null'] }
        lastRunAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }

    ScenarioStep:
      type: object
      required: [key, label, status]
      properties:
        key: { type: string }
        label: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, SUCCEEDED, FAILED, SKIPPED] }
        expected: { type: string }
        actual: { type: string }

    OperationAccepted:
      type: object
      required: [operationId, status]
      properties:
        operationId: { type: string }
        status: { type: string, enum: [ACCEPTED, QUEUED] }

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message, requestId]
          properties:
            code: { type: string }
            message: { type: string }
            requestId: { type: string }
            details: { type: object }
