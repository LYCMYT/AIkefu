            error: { type: integer }
        committedAt: { type: string, format: date-time, nullable: true }
        rows:
          type: array
          items:
            $ref: "#/components/schemas/KnowledgeImportRow"

    KnowledgeImportAccepted:
      type: object
      required: [operationId, importId, status]
      properties:
        operationId: { type: string }
        importId: { type: string }
        status: { type: string, enum: [ACCEPTED, QUEUED] }

    KnowledgeImportRow:
      type: object
      required: [rowNumber, scope, question, answer, status]
      properties:
        rowNumber: { type: integer }
        scope: { type: string, enum: [STORE, PRODUCT] }
        productId: { type: string, nullable: true }
        productExternalId: { type: string, nullable: true }
        question: { type: string }
        answer: { type: string }
        status: { type: string, enum: [VALID, DUPLICATE, CONFLICT, ERROR, COMMITTED, SKIPPED] }
