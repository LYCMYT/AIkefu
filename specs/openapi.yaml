      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [errorType, severity]
              properties:
                errorType:
                  type: string
                severity:
                  type: string
                  enum: [LOW, MEDIUM, HIGH]
                notes:
                  type: string
      responses:
        "201":
          description: Incident created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplyIncident"

  /incidents:
    parameters:
      - in: query
        name: conversationId
        required: false
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          type: string
          enum: [OPEN, CORRECTION_DRAFTED, CORRECTED, ROOT_CAUSE_FIXED, REGRESSION_ADDED, RESOLVED]
      - in: query
        name: severity
        required: false
        schema:
          type: string
          enum: [LOW, MEDIUM, HIGH]
    get:
      tags: [Incidents]
      summary: List reply incidents
      responses:
        "200":
          description: Incidents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ReplyIncident"

  /incidents/{incidentId}/correction:
    parameters:
      - in: path
        name: incidentId
        required: true
        schema:
          type: string
    post:
      tags: [Incidents]
      summary: Save or send a human correction
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [correctedAnswer]
              properties:
                correctedAnswer:
                  type: string
                sendToBuyer:
                  type: boolean
                  default: false
      responses:
        "202":
          description: Correction accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

  /incidents/{incidentId}/root-cause:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    post:
      tags: [Incidents]
      summary: Record the human root cause for an unresolved incident
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RootCauseInput"
      responses:
        "202":
          description: Root cause operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"
        "404":
          $ref: "#/components/responses/NotFound"

  /incidents/{incidentId}/add-regression:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    post:
      tags: [Incidents]
      summary: Attach a regression case to an incident
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddIncidentRegressionInput"
      responses:
        "202":
          description: Regression operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

  /incidents/{incidentId}/resolve:
    parameters:
      - $ref: "#/components/parameters/IncidentId"
    post:
      tags: [Incidents]
      summary: Resolve an incident after correction and governance
      responses:
        "202":
          description: Resolve operation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

  /replies/{replyId}/trace:
    parameters:
      - $ref: "#/components/parameters/ReplyId"
    get:
      tags: [Trace]
      summary: Get structured developer trace for a reply
      parameters:
        - in: query
          name: trace
          required: true
          description: Explicit opt-in for the developer-only trace view.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperTrace"

  /conversations/{conversationId}/trace:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Trace]
      summary: Get structured developer trace for a conversation
      parameters:
        - in: query
          name: trace
          required: true
          description: Explicit opt-in for the developer-only trace view.
          schema:
            type: string
            enum: ["1"]
      responses:
        "200":
          description: Trace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeveloperTrace"

  /usage:
    get:
      tags: [Usage]
      summary: Get current workspace AI usage
      responses:
        "200":
          description: Usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageSummary"

  /scenarios:
    x-demo-only: true
    x-synthetic: true
    description: Fixed eight-scenario synthetic lab; state is isolated to the current Demo Workspace.
    get:
      tags: [Scenarios]
      summary: List scenario definitions and status
      responses:
        "200":
          description: Scenarios
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scenario"

  /scenarios/{scenarioKey}/run:
    parameters:
      - $ref: "#/components/parameters/ScenarioKey"
    x-demo-only: true
    x-synthetic: true
    post:
      tags: [Scenarios]
      summary: Run a scenario in current workspace
      responses:
        "202":
          description: Scenario accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

  /scenarios/{scenarioKey}/reset:
    parameters:
      - $ref: "#/components/parameters/ScenarioKey"
    x-demo-only: true
    x-synthetic: true
    post:
      tags: [Scenarios]
      summary: Reset scenario state
      responses:
        "202":
          description: Reset accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

components:
  securitySchemes:
    DemoWorkspaceToken:
      type: apiKey
      in: header
      name: X-Demo-Workspace-Token

  responses:
    NotFound:
      description: Resource not found in the current Demo Workspace
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"

  parameters:
    ShopId:
      in: path
      name: shopId
      required: true
      schema: { type: string }
    ProductId:
      in: path
      name: productId
      required: true
      schema: { type: string }
    SkuId:
      in: path
      name: skuId
      required: true
      schema: { type: string }
    OrderId:
      in: path
      name: orderId
      required: true
      schema: { type: string }
    KnowledgeId:
      in: path
      name: knowledgeId
      required: true
      schema: { type: string }
    CandidateId:
      in: path
      name: candidateId
      required: true
      schema: { type: string }
    JobId:
      in: path
      name: jobId
      required: true
      schema: { type: string }
    ImportId:
      in: path
      name: importId
      required: true
      schema: { type: string }
    ConversationId:
      in: path
      name: conversationId
      required: true
      schema: { type: string }
    BuyerId:
      in: path
      name: buyerId
      required: true
      schema: { type: string }
    MessageId:
      in: path
      name: messageId
      required: true
      schema: { type: string }
    WorkflowId:
      in: path
      name: workflowId
      required: true
      schema: { type: string }
    RunId:
      in: path
      name: runId
      required: true
      schema: { type: string }
    ProposalId:
      in: path
      name: proposalId
      required: true
      schema: { type: string }
    ReviewId:
      in: path
      name: reviewId
      required: true
      schema: { type: string }
    IncidentId:
      in: path
      name: incidentId
      required: true
      schema: { type: string }
    ReplyId:
      in: path
      name: replyId
      required: true
      schema: { type: string }
    ScenarioKey:
      in: path
      name: scenarioKey
      required: true
      schema: { type: string }

  schemas:
    WorkspaceSession:
      type: object
      required: [workspace, token]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        token:
          type: string

    Workspace:
      type: object
      required: [id, status, expiresAt]
      properties:
        id: { type: string }
        status: { type: string, enum: [ACTIVE, EXPIRED, DELETED] }
        expiresAt: { type: string, format: date-time }

    Bootstrap:
      type: object
      required: [workspace, shops, buyers, featureFlags]
      properties:
        workspace:
          $ref: "#/components/schemas/Workspace"
        shops:
          type: array
          items:
            $ref: "#/components/schemas/Shop"
        buyers:
          type: array
          items:
            $ref: "#/components/schemas/Buyer"
        featureFlags:
          type: object
          additionalProperties:
            type: boolean

    ShopAIMode:
      type: string
      enum: [AUTO_ALLOWED, ASSIST_ONLY, MANUAL_ONLY]

    ShopAiReadiness:
      type: string
      enum: [OFF, PREPARING, READY, DEGRADED, FAILED]

    DemoWorkspaceProfileInput:
      type: object
      additionalProperties: false
      properties:
        profile:
          type: string
          enum: [EMPTY, SEEDED]

    ConversationMode:
      type: string
      enum: [AUTO, ASSIST, MANUAL, HOLD]

    Shop:
      type: object
      required: [id, name, platform, aiMode, aiReadiness, connectionState]
      properties:
        id: { type: string }
        name: { type: string }
        platform: { type: string, enum: [DOUYIN_DEMO] }
        aiMode:
          $ref: "#/components/schemas/ShopAIMode"
        aiReadiness:
          $ref: "#/components/schemas/ShopAiReadiness"
        connectionState:
          type: string
          enum: [CONNECTED, RECONNECTING, RECONCILING, DEGRADED, DISCONNECTED]
        enabled: { type: boolean }
        todayConversationCount: { type: integer }

    ShopSettingsInput:
      type: object
      additionalProperties: false
      required:
        - tone
        - logisticsPolicy
        - shippingPolicy
        - afterSalesPolicy
        - welcomeMessage
        - closingMessages
        - transferKeywords
        - forbiddenTerms
      properties:
        tone: { type: string }
        logisticsPolicy: { type: string }
        shippingPolicy: { type: string }
        afterSalesPolicy: { type: string }
        welcomeMessage: { type: string }
        closingMessages:
          type: object
          additionalProperties:
            type: string
        transferKeywords:
          type: array
          items: { type: string }
        forbiddenTerms:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [term, replacement]
            properties:
              term: { type: string }
              replacement: { type: string }

    ShopSettings:
      allOf:
        - $ref: "#/components/schemas/ShopSettingsInput"
        - type: object
          required: [shopId]
          properties:
            shopId: { type: string }

    Product:
      type: object
      required: [id, shopId, externalProductId, title, status]
      properties:
        id: { type: string }
        shopId: { type: string }
        externalProductId: { type: string }
        title: { type: string }
        description: { type: string }
        status: { type: string }
        recommendable: { type: boolean }
        learningStatus: { type: string }
        skus:
          type: array
          items:
            $ref: "#/components/schemas/ProductSku"

    ProductSku:
      type: object
      required: [id, externalSkuId, price, inventory]
      properties:
        id: { type: string }
        externalSkuId: { type: string }
        attributes:
          type: object
          additionalProperties:
            type: string
        price: { type: number }
        inventory: { type: integer }
        status: { type: string }

    DynamicFactInventoryCommand:
      type: object
      additionalProperties: false
      required: [inventory]
      properties:
        inventory: { type: integer, minimum: 0 }

    DynamicFactOrderStatus:
      type: string
      enum: [WAITING_SHIPMENT, SHIPPED, COMPLETED]

    DynamicFactOrderStatusCommand:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/DynamicFactOrderStatus"

    DynamicFactMutationAccepted:
      type: object
      additionalProperties: false
      required: [status, operationId]
      properties:
        status: { type: string, enum: [ACCEPTED] }
        operationId: { type: string }

    ProductSyncResult:
      type: object
      required: [status, synthetic, productsSynced]
      properties:
        status: { type: string, enum: [SUCCEEDED] }
        synthetic: { type: boolean }
        productsSynced: { type: integer, minimum: 0 }

    ProductLearningInput:
      type: object
      additionalProperties: false
      properties:
        productIds:
          type: array
          items: { type: string }
        retryFailed: { type: boolean }

    ProductLearningJobItem:
      type: object
      required: [productId, status]
      properties:
        productId: { type: string }
        status: { type: string, enum: [PENDING, PROCESSING, SUCCEEDED, FAILED, OUTDATED] }
        reason: { type: string, nullable: true }

    ProductLearningJobTotals:
      type: object
      required: [total, created, updated, skipped, failed]
      properties:
        total: { type: integer, minimum: 0 }
        created: { type: integer, minimum: 0 }
        updated: { type: integer, minimum: 0 }
        skipped: { type: integer, minimum: 0 }
        failed: { type: integer, minimum: 0 }

    ProductLearningJob:
      type: object
      required: [id, shopId, status, totals, items]
      properties:
        id: { type: string }
        shopId: { type: string }
        status: { type: string, enum: [PENDING, RUNNING, PARTIAL_SUCCESS, SUCCEEDED, FAILED] }
        totals:
          $ref: "#/components/schemas/ProductLearningJobTotals"
        items:
          type: array
          items:
            $ref: "#/components/schemas/ProductLearningJobItem"

    KnowledgeCreateInput:
      type: object
      required: [shopId, question, answer]
      properties:
        shopId: { type: string }
        productId: { type: string }
        question: { type: string }
        answer: { type: string }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time }

    KnowledgeUpdateInput:
      type: object
      properties:
        shopId: { type: string }
        question: { type: string }
        answer: { type: string }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: string, format: date-time }
        businessStatus:
          $ref: "#/components/schemas/KnowledgeBusinessStatus"

    KnowledgeBusinessStatus:
      type: string
      enum: [DRAFT, ENABLED, DISABLED, OUTDATED, CONFLICTED, DELETED]

    KnowledgeItem:
      type: object
      required: [id, shopId, scope, sourceType, businessStatus]
      properties:
        id: { type: string }
        shopId: { type: string }
        productId: { type: string }
