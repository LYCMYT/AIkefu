                shopId:
                  type: string
                buyerId:
                  type: string
                conversationId:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: Attachment created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"

  /attachments/{attachmentId}/signed-url:
