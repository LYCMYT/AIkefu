openapi: 3.1.0
info:
  title: AI Customer Service Demo API
  version: 1.0.0
  description: >
    Frozen V1 API draft for the Web-first e-commerce AI customer service demo.
    All endpoints are scoped to an anonymous Demo Workspace.
servers:
  - url: /api
security:
  - DemoWorkspaceToken: []

tags:
  - name: Workspace
  - name: Shops
  - name: Products
  - name: Knowledge
  - name: Conversations
  - name: Buyer Simulator
  - name: Attachments
  - name: Workflows
  - name: Quality
  - name: Incidents
  - name: Trace
  - name: Usage
  - name: Scenarios
  - name: Privacy

paths:
  /demo/workspaces:
    post:
      tags: [Workspace]
      security: []
      summary: Create an anonymous demo workspace
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoWorkspaceProfileInput"
      responses:
        "201":
          description: Workspace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceSession"

  /demo/workspaces/current:
    get:
      tags: [Workspace]
      summary: Get current workspace
      responses:
        "200":
          description: Current workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"

  /demo/workspaces/current/reset:
    post:
      tags: [Workspace]
      summary: Reset current workspace to seed state
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoWorkspaceProfileInput"
      responses:
        "202":
          description: Reset accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

  /bootstrap:
    get:
      tags: [Workspace]
      summary: Get bootstrap snapshot for current UI
      responses:
        "200":
          description: Bootstrap payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bootstrap"

  /shops:
    get:
      tags: [Shops]
      summary: List shops
      responses:
        "200":
          description: Shops
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Shop"
    post:
      tags: [Shops]
      summary: Add a demo shop
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [platform, templateKey]
              properties:
                platform:
                  type: string
                  enum: [DOUYIN_DEMO]
                templateKey:
                  type: string
                  enum: [FASHION_DEMO, TECH_DEMO]
                name:
                  type: string
                  maxLength: 80
                externalShopId:
                  type: string
                  maxLength: 120
                aiMode:
                  $ref: "#/components/schemas/ShopAIMode"
      responses:
        "201":
          description: Shop created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"

  /shops/{shopId}:
    parameters:
      - $ref: "#/components/parameters/ShopId"
    get:
      tags: [Shops]
      summary: Get a shop
      responses:
        "200":
          description: Shop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"

  /shops/{shopId}/ai-mode:
    parameters:
      - $ref: "#/components/parameters/ShopId"
    patch:
      tags: [Shops]
      summary: Change shop AI ceiling mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode:
                  $ref: "#/components/schemas/ShopAIMode"
      responses:
        "200":
          description: Updated shop
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Shop"

  /shops/{shopId}/settings:
    parameters:
      - $ref: "#/components/parameters/ShopId"
    get:
      tags: [Shops]
      summary: Get shop settings
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSettings"
    put:
      tags: [Shops]
      summary: Replace shop settings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShopSettingsInput"
      responses:
        "200":
          description: Settings updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShopSettings"

  /shops/{shopId}/products:
    parameters:
      - $ref: "#/components/parameters/ShopId"
    get:
      tags: [Products]
      summary: List products for shop
      parameters:
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: Products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"

  /shops/{shopId}/products/sync:
    parameters:
      - $ref: "#/components/parameters/ShopId"
    post:
      tags: [Products]
      summary: Sync dynamic product facts from MockDouyinAdapter
      responses:
        "202":
          description: Product sync accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductSyncResult"

  /shops/{shopId}/dynamic-facts/products/{productId}/skus/{skuId}/inventory:
    parameters:
      - $ref: "#/components/parameters/ShopId"
      - $ref: "#/components/parameters/ProductId"
      - $ref: "#/components/parameters/SkuId"
    patch:
      tags: [Scenarios]
      summary: Update synthetic SKU inventory for Scenario Lab
      description: >
        Mock-only dynamic-fact mutation. This endpoint updates the fixed
        MockDouyinAdapter state and never connects to a real platform or
        consumes platform credentials.
      x-demo-only: true
      x-synthetic: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DynamicFactInventoryCommand"
      responses:
        "202":
          description: Synthetic inventory mutation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicFactMutationAccepted"

  /shops/{shopId}/dynamic-facts/orders/{orderId}/status:
    parameters:
      - $ref: "#/components/parameters/ShopId"
      - $ref: "#/components/parameters/OrderId"
    patch:
      tags: [Scenarios]
      summary: Update synthetic order status for Scenario Lab
      description: >
        Mock-only dynamic-fact mutation. Status is restricted to the fixed
        demo order lifecycle and never reaches a real platform.
      x-demo-only: true
      x-synthetic: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DynamicFactOrderStatusCommand"
      responses:
        "202":
          description: Synthetic order status mutation accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DynamicFactMutationAccepted"

  /shops/{shopId}/product-learning-jobs:
    parameters:
      - $ref: "#/components/parameters/ShopId"
    post:
      tags: [Products]
      summary: Start or retry a shop-scoped product learning job
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductLearningInput"
      responses:
        "202":
          description: Product learning job accepted or current job snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductLearningJob"
    get:
      tags: [Products]
      summary: List product learning jobs for a shop
      responses:
        "200":
          description: Product learning job snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProductLearningJob"

  /products/{productId}/learn:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    post:
      tags: [Products]
      summary: Force product learning through its shop-scoped job
      parameters:
        - in: query
          name: shopId
          schema:
            type: string
      responses:
        "202":
          description: Product learning job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductLearningJob"

  /products/{productId}/mock-state:
    parameters:
      - $ref: "#/components/parameters/ProductId"
    patch:
      tags: [Products]
      summary: Update mock product state for admin or scenario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                inventoryBySku:
                  type: object
                  additionalProperties:
                    type: integer
                status:
                  type: string
                description:
                  type: string
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"

  /knowledge:
    get:
      tags: [Knowledge]
      summary: List active and historical knowledge
      parameters:
        - in: query
          name: shopId
          schema:
            type: string
        - in: query
          name: productId
          schema:
            type: string
        - in: query
          name: scope
          schema:
            type: string
            enum: [STORE, PRODUCT]
        - in: query
          name: businessStatus
          schema:
            $ref: "#/components/schemas/KnowledgeBusinessStatus"
      responses:
        "200":
          description: Knowledge items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeItem"
    post:
      tags: [Knowledge]
      summary: Create manual knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeCreateInput"
      responses:
        "201":
          description: Knowledge created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeItem"

  /knowledge/{knowledgeId}:
    parameters:
      - $ref: "#/components/parameters/KnowledgeId"
    patch:
      tags: [Knowledge]
      summary: Create a new version of knowledge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeUpdateInput"
      responses:
        "202":
          description: New version indexing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeRevisionResult"
    delete:
      tags: [Knowledge]
      summary: Soft delete knowledge
      parameters:
        - in: query
          name: shopId
          schema:
            type: string
      responses:
        "204":
          description: Soft deleted

  /knowledge/{knowledgeId}/reindex:
    parameters:
      - $ref: "#/components/parameters/KnowledgeId"
    post:
      tags: [Knowledge]
      summary: Retry knowledge indexing
      parameters:
        - in: query
          name: shopId
          schema:
            type: string
      responses:
        "202":
          description: Reindex accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeVersion"

  /knowledge/imports:
    post:
      tags: [Knowledge]
      summary: Upload Excel or CSV knowledge file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [shopId, file]
              properties:
                shopId:
                  type: string
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Import job accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeImportAccepted"

  /knowledge/imports/{jobId}:
    parameters:
      - $ref: "#/components/parameters/JobId"
    get:
      tags: [Knowledge]
      summary: Get import preview and status
      responses:
        "200":
          description: Import job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeImportJob"

  /knowledge/imports/{importId}/commit:
    parameters:
      - $ref: "#/components/parameters/ImportId"
    post:
      tags: [Knowledge]
      summary: Commit the valid rows of a previewed knowledge import
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                shopId: { type: string }
      responses:
        "201":
          description: Import committed with row outcomes
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeImportJob"

  /knowledge/search:
    post:
      tags: [Knowledge]
      summary: Search scoped knowledge with Hybrid RAG
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KnowledgeSearchInput"
      responses:
        "200":
          description: Retrieval status and evidence snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeSearchResult"

  /knowledge/candidates:
    get:
      tags: [Knowledge]
      summary: List knowledge candidates
      parameters:
        - in: query
          name: shopId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: Candidates
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeCandidate"

  /knowledge/candidates/{candidateId}/approve:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    post:
      tags: [Knowledge]
      summary: Approve candidate and create knowledge
      parameters:
        - in: query
          name: shopId
          schema:
            type: string
      responses:
        "202":
          description: Candidate approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

  /knowledge/candidates/{candidateId}/reject:
    parameters:
      - $ref: "#/components/parameters/CandidateId"
    post:
      tags: [Knowledge]
      summary: Reject candidate
      parameters:
        - in: query
          name: shopId
          schema:
            type: string
      responses:
        "204":
          description: Rejected

  /knowledge/conflicts:
    get:
      tags: [Knowledge]
      summary: List knowledge conflicts
      parameters:
        - in: query
          name: shopId
          schema:
            type: string
        - in: query
          name: status
          schema:
            type: string
      responses:
        "200":
          description: Conflicts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/KnowledgeConflict"

  /knowledge/conflicts/{conflictId}:
    parameters:
      - in: path
        name: conflictId
        required: true
        schema:
          type: string
    get:
      tags: [Knowledge]
      summary: Get one scoped knowledge conflict with immutable version snapshots
      responses:
        "200":
          description: Conflict detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KnowledgeConflict"

  /knowledge/conflicts/{conflictId}/resolve:
    parameters:
      - in: path
        name: conflictId
        required: true
        schema:
          type: string
    post:
      tags: [Knowledge]
      summary: Resolve a conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [resolution]
              properties:
                shopId:
                  type: string
                resolution:
                  type: string
                  enum: [KEEP_LEFT, KEEP_RIGHT, MERGE, CUSTOM]
                customQuestion:
                  type: string
                customAnswer:
                  type: string
      responses:
        "202":
          description: Resolution accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

  /conversations:
    get:
      tags: [Conversations]
      summary: List conversations
      parameters:
        - in: query
          name: shopId
          schema:
            type: string
        - in: query
          name: state
          schema:
            type: string
        - in: query
          name: search
          schema:
            type: string
      responses:
        "200":
          description: Conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversationSummary"

  /conversations/{conversationId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    get:
      tags: [Conversations]
      summary: Get complete conversation snapshot
      responses:
        "200":
          description: Conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationSnapshot"

  /conversations/{conversationId}/mode:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [Conversations]
      summary: Change conversation override mode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId, mode]
              properties:
                shopId:
                  type: string
                mode:
                  $ref: "#/components/schemas/ConversationMode"
      responses:
        "202":
          description: Mode change accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationControlResult"
        "409":
          description: Requested mode exceeds the current Shop AI ceiling

  /conversations/{conversationId}/messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
      - name: messageId
        in: path
        required: true
        schema: { type: string }
    delete:
      tags: [Conversations]
      summary: Locally soft-recall an assistant or human reply
      description: Preserves MessageVersion and audit history. It does not claim that the remote platform recalled an already delivered message.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [shopId]
              properties:
                shopId: { type: string }
      responses:
        "200":
          description: Local soft-recall result
          content:
            application/json:
              schema:
                type: object
                required: [id, status, remoteRecalled]
                properties:
                  id: { type: string }
                  status: { type: string, enum: [RECALLED] }
                  remoteRecalled: { type: boolean, enum: [false] }

  /conversations/{conversationId}/reply/regenerate:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [Conversations]
      summary: Regenerate an ASSIST draft from current state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId]
              properties:
                shopId:
                  type: string
      responses:
        "202":
          description: Regeneration accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

  /conversations/{conversationId}/messages:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [Conversations]
      summary: Send a human message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId, text]
              properties:
                shopId:
                  type: string
                text:
                  type: string
                  maxLength: 2000
                sourceDraftId:
                  type: string
                editType:
                  $ref: "#/components/schemas/ReplyDraftEditType"
      responses:
        "202":
          description: Human message accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HumanFinalAccepted"

  /conversations/{conversationId}/takeover:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [Conversations]
      summary: Put current conversation in MANUAL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId]
              properties:
                shopId:
                  type: string
      responses:
        "202":
          description: Takeover accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationControlResult"

  /conversations/{conversationId}/resume-ai:
    parameters:
      - $ref: "#/components/parameters/ConversationId"
    post:
      tags: [Conversations]
      summary: Explicitly resume AI for current conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId]
              properties:
                shopId:
                  type: string
      responses:
        "202":
          description: AI resume accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversationControlResult"

  /buyers/{buyerId}/memories:
    parameters:
      - $ref: "#/components/parameters/BuyerId"
    get:
      tags: [Conversations]
      summary: List customer memories
      parameters:
        - in: query
          name: shopId
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Memories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CustomerMemory"
    post:
      tags: [Conversations]
      summary: Manually create customer memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerMemoryInput"
      responses:
        "201":
          description: Memory created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMemory"

  /memories/{memoryId}:
    parameters:
      - in: path
        name: memoryId
        required: true
        schema:
          type: string
    patch:
      tags: [Conversations]
      summary: Update customer memory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CustomerMemoryInput"
      responses:
        "200":
          description: Memory updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMemory"
    delete:
      tags: [Conversations]
      summary: Delete customer memory
      parameters:
        - in: query
          name: shopId
          required: true
          schema: { type: string }
      responses:
        "204":
          description: Deleted

  /memories/{memoryId}/disable:
      parameters:
        - in: path
          name: memoryId
          required: true
          schema: { type: string }
      post:
        tags: [Conversations]
        summary: Disable customer memory without deleting its audit record
        requestBody:
          required: true
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerMemoryDisableInput"
        responses:
          "200":
            description: Memory disabled
            content:
              application/json:
                schema:
                  oneOf:
                    - $ref: "#/components/schemas/CustomerMemory"
                    - $ref: "#/components/schemas/CustomerMemoryStatusResult"

  /buyers/{buyerId}/customer-data:
    parameters:
      - $ref: "#/components/parameters/BuyerId"
    delete:
      tags: [Privacy]
      summary: Delete and anonymize customer data
      description: >
        Deletes or anonymizes customer data in the current anonymous Demo Workspace.
        The operation removes conversation content, attachments, CustomerMemory and
        related KnowledgeCandidate records, anonymizes identifiable Buyer and order
        fields, and preserves only non-identifying aggregates and minimal audit facts.
        No platform credentials or private platform data are accepted by this route.
      x-demo-only: true
      responses:
        "200":
          description: Customer data deletion completed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CustomerDataDeletionResult"

  /buyer/messages:
    post:
      tags: [Buyer Simulator]
      summary: Send a buyer message into MockDouyinAdapter
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BuyerMessageInput"
      responses:
        "202":
          description: Message accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

  /buyer/messages/{messageId}:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    patch:
      tags: [Buyer Simulator]
      summary: Edit a buyer message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
      responses:
        "202":
          description: Edit accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

  /buyer/messages/{messageId}/recall:
    parameters:
      - $ref: "#/components/parameters/MessageId"
    post:
      tags: [Buyer Simulator]
      summary: Recall a buyer message
      responses:
        "202":
          description: Recall accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

  /buyer/cards/product:
    post:
      tags: [Buyer Simulator]
      summary: Send a product card
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shopId, buyerId, productId]
              properties:
                shopId:
                  type: string
                buyerId:
                  type: string
                productId:
                  type: string
      responses:
        "202":
          description: Product card accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

  /buyer/cards/order:
    post:
