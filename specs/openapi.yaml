                  $ref: "#/components/schemas/QualityReview"
    post:
      tags: [Quality]
      summary: Manually start a conversation quality review
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [conversationId]
              properties:
                conversationId:
                  type: string
      responses:
        "202":
          description: Review accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OperationAccepted"

  /quality/reviews/{reviewId}:
    parameters:
